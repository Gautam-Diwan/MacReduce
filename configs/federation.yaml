# Three precision layers, not one:
#   compute_dtype  per Mac (GPU fast path). Need not match across machines.
#   snapshot/Adam  float32 (stability, common aggregation space).
#   wire           int8 with error feedback (bytes, so we can sync more often).
# Packed 512-token rows, 8 local steps, 3 rounds. Not a three-epoch curve.
# Tokens/credentials/Tailscale IPs do not belong in this shared file.
# Coordinator runs on m4-air together with that machine's training worker.
schema: 1
mode: gpu
coordinator: m4-air
machines:
  m4-pro:
    microbatch: 1
    accumulation: 1
    grad_checkpoint: false
    compute_dtype: bfloat16
    weight: 1.0
    gpu_ane:
      compute_dtype: float16
  m4-air:
    microbatch: 1
    accumulation: 1
    grad_checkpoint: false
    compute_dtype: bfloat16
    weight: 1.0
    gpu_ane:
      compute_dtype: float16
  m1-air:
    microbatch: 1
    accumulation: 1
    grad_checkpoint: true
    compute_dtype: float16
    weight: 1.0
training:
  rounds: 3
  local_steps: 8
  pack_sequences: true
  wire: int8
  keep_generations: 2
  max_seq_length: 512
  learning_rate: 0.0001
  seed: 1
  round_timeout: 1800
data:
  train_examples: 4096
recipe:
  rank: 8
  scale: 2.0
  dropout: 0.0
  weight_decay: 0.01
  max_grad_norm: 1.0
