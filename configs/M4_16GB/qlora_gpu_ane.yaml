# Qwen3-0.6B 4-bit QLoRA, GPU plus Neural Engine, on an M4 MacBook Pro with 16 GB (Mac16,1).
# Same recipe as configs/qlora_m4.yaml. Batch size and gradient checkpointing are fixed to the
# values the baseline run chose (evidence/qwen3-0.6b-curve/2026-10-29T00-07-18/config.yaml),
# so this run has the same 12,288 steps and learning-rate schedule as that baseline.
# Fixing both also skips the batch-fit search, which writes into evidence/batch-fit.
# Blocks 0-26 stay on the GPU; block 27 (frozen base plus LoRA) is one Neural Engine program.
# Runs land under logging.dir, separate from the baseline directory.

data:
  dataset: Salesforce/wikitext
  config: wikitext-2-raw-v1
  revision: b08601e04326c79dfdd32d625aee71d232d685c3
  path: data/wikitext-2-raw-v1
  train_examples: 4096

model:
  name: mlx-community/Qwen3-0.6B-4bit
  revision: 73e3e38d981303bc594367cd910ea6eb48349da8
  max_seq_length: 512
  lora_rank: 8
  lora_scale: 2.0
  lora_dropout: 0.0
  num_layers: -1

training:
  batch_size: 1
  grad_accumulation_steps: 1
  grad_checkpoint: false
  epochs: 3
  learning_rate: 0.0001
  weight_decay: 0.01
  max_grad_norm: 1.0
  lr_schedule:
    name: cosine_decay
    warmup: 300
    warmup_init: 1.0e-7
    end: 1.0e-6
  optimizer: adamw
  iters: null
  steps_per_report: 10
  val_batches: -1
  test_batches: -1

placement:
  mode: gpu_ane

infrastructure:
  seed: 0
  memory_limit_bytes: auto
  prometheus_port: 9096

checkpoint:
  save_every: epoch
  resume: null

logging:
  dir: evidence/M4_16GB/gpu_ane
