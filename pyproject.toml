[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macreduce-lab"
version = "0.1.0"
description = "Observable local-SGD experiments across heterogeneous Macs"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0,<3", "psutil>=7,<8"]

[project.optional-dependencies]
mlx = ["mlx==0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'"]
cpu = ["torch>=2.8,<3"]
dev = ["pytest>=8,<10", "ruff>=0.12"]

[project.scripts]
macreduce = "macreduce.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
